function animate(){
 requestAnimationFrame(animate);
 const t=audio.currentTime||0;
 const slot=Math.min(TOTAL_SHOTS-1,Math.floor(t/SHOT_SECONDS));
 const idx=(slot*7+Math.floor(slot/9)*5)%16;
 const local=(t-slot*SHOT_SECONDS)/SHOT_SECONDS;
 const p=easeInOut(Math.max(0,Math.min(1,local)));
 if(slot!==lastSlot){
  lastSlot=slot;
  chapter.textContent='';
  setPalette(idx+slot);
  camera.fov=62+Math.sin(slot*.7)*3;
  camera.updateProjectionMatrix();
 }
 let beat=0;
 if(analyser){analyser.getByteFrequencyData(data);for(let i=2;i<28;i++)beat+=data[i];beat=beat/(26*255)}
 const g=routeShots[slot];
 const seed=slot*1.61803398875;
 // Keep one uninterrupted forward trajectory; the next environment is already visible ahead.
 const startEase=1-Math.exp(-t/2.4);
 const travel=140*(t/SHOT_SECONDS-2.4/SHOT_SECONDS*(1-startEase));
 const u=local,phase=t*.18,mode=slot%10;
 let x=0,y=0,roll=0,lookX=0,lookY=0;
 if(mode===0){x=Math.sin(phase)*7;y=Math.sin(phase*.7)*3}
 if(mode===1){x=-15+30*u;y=5*Math.sin(u*Math.PI*2);roll=.05*Math.sin(u*Math.PI*2)}
 if(mode===2){x=Math.cos(u*Math.PI*2)*15;y=Math.sin(u*Math.PI*2)*9;roll=.08*Math.sin(u*Math.PI*2)}
 if(mode===3){x=12*Math.sin(u*Math.PI);y=-12+24*u;roll=-.12+u*.24}
 if(mode===4){x=18*Math.cos(u*Math.PI);y=7*Math.sin(u*Math.PI*2);roll=.1*Math.cos(u*Math.PI*2)}
 if(mode===5){x=-10+20*u;y=9*Math.sin(u*Math.PI);lookX=8*Math.sin(u*Math.PI*2)}
 if(mode===6){x=8*Math.sin(u*Math.PI*3);y=12*Math.cos(u*Math.PI*2);roll=.16*Math.sin(u*Math.PI*3)}
 if(mode===7){x=22*Math.sin(u*Math.PI*2);y=4+8*Math.cos(u*Math.PI*2);lookY=7*Math.sin(u*Math.PI*2)}
 if(mode===8){x=5*Math.sin(u*Math.PI*4);y=-15+30*u;roll=.18*Math.sin(u*Math.PI*2)}
 if(mode===9){x=16*Math.cos(u*Math.PI*2);y=10*Math.sin(u*Math.PI*2);lookX=-10*Math.sin(u*Math.PI*2)}
 const z=24-travel;
 camera.position.set(x,y,z);
 camera.lookAt(x*.58+lookX+Math.sin(phase*.5)*2,y*.55+lookY,z-74);
 camera.rotation.z+=roll;
 const pulse=1+beat*.025;
 g.scale.setScalar(idx===10?pulse+beat*.08:pulse);
 g.rotation.y=Math.sin(seed)*.12+t*.008+beat*.018;
 g.rotation.x=Math.cos(seed*.6)*.08+Math.sin(t*.04)*.018;
 g.rotation.z=Math.sin(seed*.4)*.06+Math.sin(t*.025)*.012;
 if(idx===2)g.children.forEach((o,i)=>{if(i>0){const a=t*(.22+i*.07)+i*2.1;o.position.x=Math.cos(a)*(i===1?25:13);o.position.y=Math.sin(a)*(i===1?7:4)}});
 if(idx===3||idx===5||idx===9||idx===14)g.rotation.y+=.12*Math.sin(t*.16);
 if(idx===4&&g.children[0]){g.children[0].position.x=-36+local*72;g.children[0].position.y=8+Math.sin(local*Math.PI*2)*7}
 if(idx===6)g.children.forEach((o,i)=>{if(i%3===0)o.position.x+=Math.sin(t*1.8+i)*.08});
 if(idx===12)g.children.forEach((o,i)=>{if(i===1||i===2)o.rotation.z+=.012+beat*.018});
 if(idx===13){g.children[0].position.x=Math.cos(t*.65)*13;g.children[0].position.y=Math.sin(t*.65)*5;g.children[1].position.x=Math.cos(t*.65+Math.PI)*13;g.children[1].position.y=Math.sin(t*.65+Math.PI)*5}
 if(idx===15)g.rotation.z=Math.sin(t*2.4)*.06;
 // Background stars and the drifting nebula stay around the moving camera.
 nebulaMat.uniforms.uTime.value=t;
 nebula.position.set(camera.position.x+Math.sin(t*.018)*18,camera.position.y+Math.cos(t*.014)*8,camera.position.z-190);
 nebula.rotation.z=Math.sin(t*.02)*.12;
 key.position.set(camera.position.x+8,camera.position.y+5,camera.position.z-55);
 key.intensity=105+beat*180;
 bloomPass.strength=1.05+beat*.48+(idx===10?.65:0);
 bloomPass.radius=.72;
 bloomPass.threshold=idx===10?.12:.2;
 composer.render();
const duration=audio.duration||262.4;bar.style.width=(t/duration*100)+'%';document.querySelector('#now').textContent=fmt(t);document.querySelector('#total').textContent=fmt(duration);
if(!hasStarted&&t>.5){hasStarted=true;intro.style.opacity=0;loading.style.opacity=0}
}
playBtn.onclick=async()=>{if(audio.paused){try{if(audioCtx?.state==='suspended')await audioCtx.resume();await audio.play();intro.style.opacity=0;loading.style.opacity=0;playBtn.textContent='Ⅱ'}catch(e){loading.textContent='TAP PLAY TO BEGIN';loading.style.opacity=1}}else{audio.pause();playBtn.textContent='▶'}};
audio.onplay=()=>{playBtn.textContent='Ⅱ';intro.style.opacity=0;loading.style.opacity=0;revealControls()};audio.onpause=()=>{playBtn.textContent='▶';document.querySelector('.controls').classList.remove('is-hidden');clearTimeout(uiIdleTimer)};audio.onended=()=>{intro.style.opacity=1;intro.querySelector('small').textContent='THE UNIVERSE HAS NO EDGE'};
document.querySelector('#restart').onclick=()=>{audio.currentTime=0;if(audio.paused)playBtn.click()};
document.querySelector('#mute').onclick=e=>{audio.muted=!audio.muted;e.target.textContent=audio.muted?'SOUND OFF':'SOUND ON'};
seek.onclick=e=>{const r=seek.getBoundingClientRect();audio.currentTime=Math.max(0,Math.min(1,(e.clientX-r.left)/r.width))*(audio.duration||262.4)};
document.addEventListener('keydown',e=>{if(e.code==='Space'&&e.target.tagName!=='BUTTON'){e.preventDefault();playBtn.click()}});
addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight);renderer.setPixelRatio(Math.min(devicePixelRatio,1.7));composer.setSize(innerWidth,innerHeight);bloomPass.setSize(innerWidth,innerHeight)});
animate();loading.style.opacity=0;
</script></body></html>
