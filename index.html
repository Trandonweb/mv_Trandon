<script type="module">

{

}

{
 const g=group();terrain(g,220,90,(x,z)=>-2+Math.sin(x*.035)*2+Math.cos(z*.03)*1.4,m.rock);
 for(let i=0;i<10;i++)mountain(g,-125+i*28,-90-(i%4)*16,22,38+(i%3)*16,20,4+i,i%2===0);
 const arch=new THREE.Group();g.add(arch);const stone=mat('#9d8d79',.92);for(const x of [-9,9]){const p=mesh(arch,new THREE.BoxGeometry(2.8,20,3.2),stone,x,10,-35);p.rotation.z=x<0?-.04:.04}
 const top=mesh(arch,new THREE.TorusGeometry(9,1.5,12,64,Math.PI),stone,0,19,-35);top.rotation.z=Math.PI;
 const path=mesh(g,new THREE.PlaneGeometry(18,150),mat('#766c5f'),0,-.5,25);path.rotation.x=-Math.PI/2;

{
 const g=group();terrain(g,170,90,(x,z)=>-1+Math.sin(x*.07)*.45+Math.cos(z*.06)*.5,m.grass);
 for(let row=0;row<7;row++)for(let i=0;i<13;i++){const x=(i-6)*13+(row%2)*6,z=-75+row*24;if(Math.abs(x)<15&&z>5)continue;tree(g,x,z,.8+(i%4)*.16,(i+row)%2)}

{
 const g=group();terrain(g,260,100,(x,z)=>-6+Math.sin(x*.025)*1.5,m.snow);

 for(let i=0;i<30;i++)cloud(g,-180+(i%6)*68,2+Math.floor(i/6)*5,-100+Math.floor(i/6)*40,.7+(i%3)*.25);
 const steps=new THREE.Group();g.add(steps);for(let i=0;i<18;i++){const s=mesh(steps,new THREE.BoxGeometry(7,.65,4),mat('#d6c5a6',.48,.18),-2+i*.65,-2+i*1.2,22-i*7);s.rotation.z=-.04}

// 5: the frame, the reveal, and the great crossing
{
 const g=group();sea(g);terrain(g,280,80,(x,z)=>-7+Math.sin(x*.02)*1.3,m.sand);
 for(let i=0;i<9;i++)mountain(g,-150+i*38,-120-(i%3)*25,34,42+(i%3)*14,30,13+i);

// 6: calm sunrise, ocean horizon, and an open sky
{
 const g=group();sea(g);terrain(g,300,80,(x,z)=>-5+Math.sin(x*.018)*1.2,m.sand);

const totalDuration=262.4;let active=-1,started=false,analyser=null,data=null;
const audioCtx=(()=>{try{return new (window.AudioContext||window.webkitAudioContext)()}catch(e){return null}})();
if(audioCtx){const src=audioCtx.createMediaElementSource(audio);analyser=audioCtx.createAnalyser();analyser.fftSize=256;src.connect(analyser);analyser.connect(audioCtx.destination);data=new Uint8Array(analyser.frequencyBinCount)}
function setChapter(t){let n=0;for(let i=0;i<chapters.length;i++)if(t>=chapters[i].t)n=i;if(n!==active){active=n;chapter.textContent=chapters[n].n;caption.textContent=chapters[n].c;caption.style.opacity=n===0?0:1}}
const smooth=x=>{x=Math.max(0,Math.min(1,x));return x*x*(3-2*x)};
function animate(){requestAnimationFrame(animate);const t=audio.currentTime||0;setChapter(t);let idx=0;for(let i=0;i<chapters.length;i++)if(t>=chapters[i].t)idx=i;

const local=t-chapters[idx].t;const beat=(()=>{if(!analyser)return 0;analyser.getByteFrequencyData(data);let s=0;for(let i=2;i<30;i++)s+=data[i];return s/(28*255)})();
const camPaths=[
{p:[Math.sin(t*.08)*2,7+Math.sin(t*.13)*.5,34-t*.05],look:[0,4,-40]},
{p:[-22+t*.48,9+Math.sin(t*.12)*1.2,42-t*.8],look:[0,4,-50]},
{p:[Math.sin(t*.18)*14,10,48-local*.8],look:[0,9,-30]},
{p:[Math.sin(t*.09)*20,10+Math.sin(t*.17)*2,45-local*.65],look:[0,8,-25]},
{p:[-26+local*.65,17+Math.sin(t*.1)*2,45-local*.75],look:[0,16,-45]},
{p:[-3+Math.sin(local*.09)*5,14+Math.sin(local*.11)*2,70-smooth(local/38)*58],look:[0,17,-42]},
{p:[0,12,40-local*.22],look:[0,12,-80]}

let intensity=idx===5?smooth((local-2)/10)*(1-smooth((local-37)/7)):0;
camera.position.set(camPaths.p[0],camPaths.p[1],camPaths.p[2]);camera.lookAt(...camPaths.look);
if(idx===5){camera.position.z-=intensity*20;camera.fov=48+intensity*5;camera.updateProjectionMatrix();const p=groups[5].userData.portal;p.rotation.z=Math.sin(t*.7)*.035;p.scale.setScalar(1+intensity*.22+beat*.045);groups[5].userData.gate.material.opacity=.48+intensity*.45;groups[5].userData.glow.material.opacity=.12+intensity*.55;sun.intensity=3.2+intensity*5+beat*2;}else{camera.fov=48;camera.updateProjectionMatrix();sun.intensity=3.2+beat*.4}
groups[idx].rotation.y=Math.sin(t*.04)*.025;
groups[idx].children.forEach(o=>{if(o.userData.wave&&o.geometry.attributes.position){const p=o.geometry.attributes.position;for(let i=0;i<p.count;i++){const x=p.getX(i),z=p.getZ(i);p.setY(i,-1+Math.sin(x*.055+t*.8)*.25+Math.cos(z*.047+t*.7)*.2)}p.needsUpdate=true;o.geometry.computeVertexNormals()}});

}
const fmt=t=>String(Math.floor(t/60)).padStart(2,'0')+':'+String(Math.floor(t%60)).padStart(2,'0');

audio.onplay=()=>{playBtn.textContent='Ⅱ';intro.style.opacity=0;loading.style.opacity=0};audio.onpause=()=>playBtn.textContent='▶';audio.onended=()=>{intro.style.opacity=1;intro.querySelector('small').textContent='THE WORLD IS STILL OPEN'};
